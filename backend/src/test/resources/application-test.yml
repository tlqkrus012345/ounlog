spring:
  ai:
    openai:
      api-key: test-api-key
    google:
      genai:
        api-key: test-gemini-api-key
        chat:
          model: gemini-3.8-flash
          response-mime-type: application/js

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  access-token-ttl: 15m
  private-key-location: classpath:jwt/test-private-key.pem
  public-key-location: classpath:jwt/test-public-key.pem
