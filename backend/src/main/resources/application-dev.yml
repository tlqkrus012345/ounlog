server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ounlog
    username: ounlog
    password: ${MYSQL_PASSWORD}
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
