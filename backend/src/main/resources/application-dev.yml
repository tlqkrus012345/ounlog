server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ounlog
    username: ounlog
    password: ${MYSQL_PASSWORD}
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    retry:
      max-attempts: 1
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: ${GEMINI_MODEL}
          response-mime-type: application/json
    openai:
      api-key: ${OPENAI_API_KEY}


jwt:
  access-token-ttl: 15m
  private-key-location: file:${JWT_PRIVATE_KEY_PATH}
  public-key-location: file:${JWT_PUBLIC_KEY_PATH}
